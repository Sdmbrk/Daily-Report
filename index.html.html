<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Manpower Report · MGC</title>
<meta name="description" content="MGC MEP daily manpower and progress report">
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MEP Report">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--navy:#2a3a9a;--navy2:#222f80;--ok:#059669;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
.top{background:linear-gradient(135deg,#0f2a44 0%,#134e4a 100%);color:#fff;padding:10px 24px 10px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{color:#fca5a5;font-family:ui-monospace,Consolas,monospace;letter-spacing:.14em;font-size:10px}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.top .sub{color:#cbd5e1;font-size:12px;margin-top:0;line-height:1.2}
.ver{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:#cbd5e1;width:100%;padding-top:8px;margin-top:2px;border-top:1px solid rgba(255,255,255,.15)}
.ver .ghostbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;font:inherit;font-size:11px}
.dbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px;padding:6px 8px;background:#fff;border:1px solid #e2e8f0;border-radius:10px}
.dbbar .dbbar-lbl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.dbbar .btn{padding:5px 10px;font-size:12px}
.wrap{padding:14px 24px 40px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{background:#f8fafc}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy2)}
.btn.ghost{background:transparent;border-color:var(--line);color:#475569}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{padding:7px 9px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;font-size:13px;background:#fff;color:var(--ink);min-width:0}
.inp:focus,.cell:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(42,58,154,.12)}
.inp:disabled{background:#f8fafc;color:#94a3b8}
.inp.num{width:70px;text-align:right}
label.fl,.lbl{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;gap:4px}
.cell{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font:inherit;color:var(--ink)}
.cell:hover{border-color:#cbd5e1;background:#fff}
.x{border:0;background:none;color:var(--bad);font-size:15px;cursor:pointer;padding:0 6px;font-weight:700}
.x.plus{color:var(--navy);font-size:12px;font-weight:700}
.x.plus.addth{background:var(--navy);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;margin-right:4px;box-shadow:0 1px 2px rgba(15,23,42,.18);transition:background .15s,transform .1s;white-space:nowrap}
.x.plus.addth:hover{background:var(--navy2)}
.x.plus.addth:active{transform:scale(.96)}
.x.plus.addth:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.empty{color:var(--mut);padding:24px;background:#fff;border-radius:12px;border:1px dashed #cbd5e1}
.muted{color:#94a3b8;font-size:12px}
.cl-panel{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(15,23,42,.06);border-left:4px solid var(--navy)}
.cl-panel h3{margin:0 0 6px;font-size:15px}
.cl-panel ul{margin:6px 0 0 18px;padding:0}
.cl-panel li{margin:3px 0}
/* Projects window (matches the MGC screenshot) */
.ptitle{margin:4px 0 14px;font-size:28px;font-weight:800;letter-spacing:.02em}
.pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:14px;border-bottom:3px solid var(--navy);margin-bottom:18px}
.prj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.prj-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);display:flex;flex-direction:column}
.prj-card.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(42,58,154,.15)}
.thumb{display:flex;gap:2px;height:150px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-items:center;justify-content:center}
.thumb img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.thumb .strip{display:flex;gap:2px;height:96px;width:100%;padding:8px;background:#f8fafc}
.thumb .strip i{display:block;border-radius:3px;min-width:3px}
.thumb em{color:#94a3b8;font-style:normal;font-size:12px}
.prj-card h3{font-size:16px;letter-spacing:.04em;font-weight:800;margin:12px 0 4px}
.meta{color:var(--mut);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.tchip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--c);color:#fff}
.owner{color:var(--mut);font-size:12px;margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.ed-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ed-head h3{margin:2px 0 0;font-size:18px}
.ed-kicker{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:#b5452f}
.ed-btns{display:flex;gap:8px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.ptinfo{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#475569;margin-bottom:4px}
.ed-sub{margin:18px 0 8px;font-weight:700;font-size:14px}
.maps{display:flex;flex-wrap:wrap;gap:10px}
.mapitem{width:220px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.mapitem img{display:block;width:100%;height:130px;object-fit:contain;background:#fff}
.mapitem .mrow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;margin-top:4px}
.mapitem .mrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropline{margin-top:8px}
.th-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th-list.edit{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.th-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.th-card.edit{border-color:#c7d2fe}
.th-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.th-top b{font-size:14px}
.th-tot{font-size:12px;font-weight:800;background:#0f172a;color:#fff;border-radius:999px;padding:2px 9px;min-width:30px;text-align:center}
.th-chips{display:flex;flex-wrap:wrap;gap:4px}
.th-chips .tchip{font-size:10.5px;padding:2px 7px}
.th-name{font-weight:700;flex:1;min-width:0;padding:4px 6px}
.th-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tin{display:flex;align-items:center;justify-content:space-between;gap:6px;border-left:4px solid var(--c);background:#f8fafc;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;color:#334155}
.tin input{width:60px;text-align:right;padding:3px 4px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:12px;background:#fff}
.blk-h{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.blk{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.blk input.nm{flex:1;min-width:0;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:12px}
.blk input.bv{width:70px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:12px;text-align:right}
.ptotals{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 12px;background:var(--c);color:#fff;font:inherit;font-size:12px;font-weight:700}
.tbtn b{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px}
.tbtn.all{background:#0f172a}
.ed-actions{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:12px}
.ed-danger{margin-top:22px;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ed-danger-row{display:flex;gap:8px;flex-wrap:wrap}
.ed-danger span{color:var(--mut);font-size:12px;margin-left:8px}
/* Project daily report */
.ph-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.ph-name{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:.02em}
.daybar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.daybar .exp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.wd-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wd{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);border-top:4px solid var(--c)}
.wd.on{background:var(--c);color:#fff;border-color:var(--c)}
.wd b{margin-left:8px;font-size:11px;opacity:.85}
.rep{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);overflow:hidden}
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc}
.rep-head b{font-size:15px;letter-spacing:.02em}
.rep-head .lbl input{width:220px}
.sumchips{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:#334155}
.sumchips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.tbl{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:#475569;text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:3px 5px;border-bottom:1px solid #eef2f6;vertical-align:middle}
td.n,th.n{text-align:right}
td.c{text-align:center}
td.gname{font-weight:800;background:var(--tint);font-size:12px;min-width:150px;white-space:normal;border-right:1px solid var(--line)}
tr.orph td{color:#92400e}
td.sname{min-width:200px;white-space:normal}
td.mainpct b{background:#ecfdf5;color:#065f46;border-radius:6px;padding:3px 7px;font-size:12.5px}
td.mainpct b:empty{display:none}
tr.gfirst td{border-top:2px solid #cbd5e1}
tfoot td{background:#f8fafc;font-weight:700;border-top:2px solid #cbd5e1}
select.inp{max-width:200px}
td select.inp{min-width:112px}
td select.inp:disabled{min-width:84px}
td select.inp,td input.inp{width:100%;padding:4px 5px;font-size:12px}
td input.inp.num{width:62px}
td input.rem{min-width:160px}
.bad-row td{background:#fff7ed}
.addbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.band td{background:#0f172a;color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:7px 10px}
tr.subh td{background:#eef2ff;font-weight:700;color:#1e293b;padding:6px 10px}
tr.subtot td{background:#f8fafc;font-weight:700;text-align:right;padding:5px 10px}
tr.gt td{background:#e2e8f0;font-weight:800;text-align:right;padding:8px 10px}
/* Activity and subcontractor databases */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.act-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.act-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.act-h .cell{font-weight:800;font-size:14px;flex:1}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#166534}
.badge.bad{background:#fee2e2;color:#991b1b}
.act-card table{font-size:12.5px}
.act-card th{position:static}
.addrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.addrow .inp:first-child{flex:1;min-width:160px}
.dbl{margin-bottom:12px}
.pill-cb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-right:10px}
.discbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.25);z-index:50;font-weight:600}
.toast.err{background:#b91c1c}
.sess[hidden]{display:none}
.sess{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#cbd5e1}
.sess b{color:#fff}
.adm-sec{margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}
.adm-sec h3{margin:0 0 8px}
.acc-table{width:100%;border-collapse:collapse;font-size:13px}
.acc-table th,.acc-table td{border-bottom:1px solid #e2e8f0;padding:8px 6px;text-align:center}
.acc-table th.l,.acc-table td.l{text-align:left}
.login-card{max-width:460px;margin:24px auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px}
.login-card h2{margin:0 0 6px}
.blk.mixed{display:block;padding:8px}
.blk.mixed .blk-row{display:flex;gap:6px;align-items:center}
.blk.mixed .blk-row .nm{flex:1;min-width:0}
.blk.mixed .mix{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.blk.mixed .mix .tin input{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;background:#fff;font-size:12px}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg input[type=color]{width:26px;height:22px;padding:0;border:0;background:none}
.legend .addrow{margin-top:0}
@media (max-width:760px){.wrap{padding:16px 12px 32px}.top{padding:18px 14px 0}.act-grid{grid-template-columns:1fr}.prj-grid{grid-template-columns:1fr}}
.no{display:inline-block;min-width:34px;font-weight:700;color:#475569;font-variant-numeric:tabular-nums}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px}
.hub-card{position:relative;overflow:hidden;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:22px 22px 18px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 22%,#e2e8f0);background:linear-gradient(160deg,#fff 55%,var(--t));box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 22px -12px color-mix(in srgb,var(--c) 45%,transparent);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.hub-card::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff))}
.hub-card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 18px 34px -14px color-mix(in srgb,var(--c) 55%,transparent);border-color:color-mix(in srgb,var(--c) 45%,#fff)}
.hub-card:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 40%,#fff);outline-offset:2px}
.hub-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 8px 16px -8px var(--c)}
.hub-ico svg{width:26px;height:26px}
.hub-txt{display:flex;flex-direction:column;gap:4px}
.hub-txt em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.hub-txt b{font-size:18px;line-height:1.25;color:#0f2a44}
.hub-txt > span{color:#64748b;font-size:13px;line-height:1.45}
.hub-go{align-self:flex-start;margin-top:auto;font-size:13px;font-weight:700;color:var(--c);padding:6px 12px;border-radius:999px;background:var(--t)}
.lsup{margin-top:16px}
.lsup-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px}
.psec-bar{margin:12px 0;position:sticky;top:0;z-index:30;padding:8px 0;background:#f1f5f9}
.soon{margin-top:16px;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:24px;color:#475569}
.soon h3{margin:0 0 6px;color:#0f2a44}
.secp{display:inline-flex;gap:4px;align-items:center;white-space:nowrap;cursor:pointer}
.secs{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:flex-start;font-size:12px;color:#475569}
.secs label{display:flex;gap:4px;align-items:center;white-space:nowrap;cursor:pointer}
.secs label:has(input:disabled){opacity:.45;cursor:default}
.pm-wrap{margin-top:8px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
.pm-frame{display:block;width:100%;height:calc(100vh - 170px);min-height:720px;border:0;background:#fff}
.pm-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-compact{gap:8px;margin-bottom:8px;flex-wrap:nowrap}
.ph-compact .ph-title{min-width:0}
.ph-compact .eyebrow{display:block;line-height:1.2}
.ph-compact .ph-name{margin:0;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-spacer{flex:1}
.pg-outer{display:flex;align-items:stretch;gap:6px}
.pg-wrap{flex:1;min-width:0;overflow:auto;max-height:72vh;background:#fff;border:1px solid var(--line);border-radius:12px}
.pg-arrow{flex:0 0 34px;align-self:center;height:56px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:22px;font-weight:700;line-height:1;cursor:pointer;color:var(--navy)}
.pg-arrow:hover{background:#eef2ff}
.pg-tbl{border-collapse:separate;border-spacing:0;font-size:12px}
.pg-tbl th,.pg-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 3px;vertical-align:top;min-width:46px;background:#fff}
.pg-tbl thead th{position:sticky;top:0;z-index:2;background:#f8fafc;text-align:left;font-weight:700}
.pg-tbl thead tr:first-child th{z-index:3}
.pg-tbl .pg-first{position:sticky;left:0;z-index:1;min-width:150px;font-weight:700;background:#f8fafc}
.pg-tbl thead .pg-first{z-index:4}
.pg-tbl .pg-main{background:#e0e7ff;color:#1e1b4b;font-size:11px}
.pg-tbl .pg-sub{font-weight:600;min-width:60px;max-width:80px;white-space:normal;font-size:11px}
.pg-pct{display:flex;align-items:center;gap:2px;white-space:nowrap}
.pg-pct::after{content:'%';font-size:12px;font-weight:600;color:#334155}
.pg-in{width:34px;padding:3px 2px;font-size:12px;text-align:left;-moz-appearance:textfield}
.pg-in::-webkit-inner-spin-button,.pg-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pg-left{font-size:10px;color:var(--mut);margin-top:2px;white-space:normal;line-height:1.2}
</style>
</head>
<body>
<header class="top">

  const pr = st[pid] = st[pid] || {}, dk = pr[k] = pr[k] || {}, tt = dk[th] = dk[th] || {}, bb = tt[blk] = tt[blk] || {};
  if (v == null) delete bb[sid]; else bb[sid] = v;
}
function migrateProgress(s){
  s.prog = s.prog || {};
  Object.entries(s.reports || {}).forEach(([pid, days]) => {
    Object.keys(days || {}).sort().forEach(date => {
      ['EL', 'PL', 'HV'].forEach(k => ((((days[date] || {})[k]) || {}).rows || []).forEach(r => {
        if (r.th && r.sid && r.pct !== null && r.pct !== undefined && r.pct !== '' && isFinite(+r.pct)) progStore(s.prog, pid, k, r.th, r.block || '', r.sid, +r.pct);
      }));
    });
  });
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && Array.isArray(s.projects) && s.act && s.subs && s.reports) {
      if (!(s.seedVer >= 2)) {
        // add projects that were introduced after this data was saved
        SEED_PROJECTS.forEach(sp => { if (!s.projects.some(p => p.id === sp.id)) s.projects.push(JSON.parse(JSON.stringify(sp))); });
        s.seedVer = 2;
      }
      // version 1.2: access settings (admin password hash and users)
      if (!s.access || !Array.isArray(s.access.users)) s.access = {adminHash: s.access && s.access.adminHash || null, users: []};
      if (!(s.seedVer >= 3)) s.seedVer = 3;
      // version 1.6: block split of the Taormina map, once
      if (!(s.seedVer >= 4)) { applyBlockSeed(s, []); s.seedVer = 4; }
      // version 1.7: blocks hold a mix of villa types; TH-R07 and TH-R08 get the 4BR-LUX + 5BR-LUX split per block
      if (!(s.seedVer >= 5)) {
        (s.projects || []).forEach(p => (p.ths || []).forEach(t => { if ((t.blocks || []).length) syncTh(t); }));
        applyBlockSeed(s, ['TH-R07', 'TH-R08']);
        s.seedVer = 5;
      }
      // version 1.8: TH-R09 blocks (B1 and B2 as TH-R08, B3 two 5BR-LUX, B4 one 4BR-STANDALONE)
      if (!(s.seedVer >= 6)) { applyBlockSeed(s, ['TH-R09']); s.seedVer = 6; }
      // version 1.9: TH-R17 blocks (B1 to B5 as TH-R08, B6 one 4BR-STANDALONE)
      if (!(s.seedVer >= 7)) { applyBlockSeed(s, ['TH-R17']); s.seedVer = 7; }
      // version 1.10: each project has its own villa types and colours
      if (!(s.seedVer >= 8)) { (s.projects || []).forEach(ensureTypes); s.seedVer = 8; }
      // version 1.20: labour supplier database; labour supplier counts move from activity lines to a per-day list
      if (!(s.seedVer >= 9)) { s.labsup = s.labsup || []; migrateLabSup(s); s.seedVer = 9; }
      if (!(s.seedVer >= 10)) { migrateSupLines(s); s.seedVer = 10; }
      // version 1.32: Electrical 1ST FIX WORKS gets COLUMN WORKS (5%), taken from BACKBOX & PIPING, once
      if (!(s.seedVer >= 11)) { migrateColumnWorks(s); s.seedVer = 11; }
      // version 1.37: SLAB WORKS (Electrical and Plumbing) becomes GF, 1F and 2F SLAB WORKS with the same sub activities, once.
      // Existing entries stay under GF SLAB WORKS.
      if (!(s.seedVer >= 12)) { migrateSlabFloors(s); s.seedVer = 12; }
      // version 1.40: progress by activity, filled from the saved daily reports (latest % wins), once
      if (!(s.seedVer >= 13)) { migrateProgress(s); s.seedVer = 13; }
      return s;
    }
  } catch (e) {}
  return seedState();
}
/* Undo and redo: every saved change is a step. Snapshots are whole-app states (before each change). */
const HIST_MAX = 30;
let undoStack = [], redoStack = [];
function save(){
  const cur = JSON.stringify(S);
  try { localStorage.setItem(KEY, cur); }
  catch (e) { toast('Storage is full. Remove a map image, or make a backup now.', true); return false; }
  if (cur !== lastSnap) {
    undoStack.push(lastSnap);
    if (undoStack.length > HIST_MAX) undoStack.shift();
    redoStack = [];
    lastSnap = cur;
  }
  updateHistBtns();
  return true;
}
function updateHistBtns(){
  const u = $('#btnUndo'), r = $('#btnRedo');
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}
function applySnap(snap){
  S = JSON.parse(snap); lastSnap = snap;
  try { localStorage.setItem(KEY, snap); } catch (e) {}
  render(); updateHistBtns();
}
function undo(){
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  redoStack.push(lastSnap); applySnap(undoStack.pop()); toast('Undone');
}
function redo(){
  if (!redoStack.length) { toast('Nothing to redo'); return; }
  undoStack.push(lastSnap); applySnap(redoStack.pop()); toast('Redone');
}

const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function hashPw(pw, salt){ return toHex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw))); }
async function setAdminPw(pw){
  const salt = toHex(crypto.getRandomValues(new Uint8Array(12)));
  const h = await hashPw(pw, salt);
  S.access.adminHash = salt + ':' + h;
}
async function checkAdminPw(pw){
  if (!gateOn()) return false;
  const [salt, h] = S.access.adminHash.split(':');
  return (await hashPw(pw, salt)) === h;
}

/* ============ Activity lookups ============ */
function findMain(k, mid){ return (S.act[k] || []).find(m => m.id === mid); }
// Numbering: main activity 1, 2, 3 and sub activity 1.1, 1.2 within it (order of the Activity database).
function actNo(k, mid, sid){
  const mi = (S.act[k] || []).findIndex(m => m.id === mid);
  if (mi < 0) return '';
  if (!sid) return String(mi + 1);
  const si = S.act[k][mi].subs.findIndex(s => s.id === sid);
  return si < 0 ? '' : (mi + 1) + '.' + (si + 1);
}
function findSub(k, sid){
  for (const m of (S.act[k] || [])) { const s = m.subs.find(x => x.id === sid); if (s) return {m, s}; }
  return null;
}
function subW(k, sid){ const f = findSub(k, sid); return f ? (+f.s.w || 0) : 0; }

/* ============ Daily report data ============ */
function newRow(mid, sid, mname, sname){
  return {id:'r' + uid(), mid, sid, mname, sname, th:'', block:'', pct:null, rem:'', lab:{}};
}
// Keep one row per sub activity in database order; extra TH rows stay together; removed items stay visible.
function syncRows(d, k){
  const old = d[k].rows || [], out = [], seen = new Set();
  (S.act[k] || []).forEach(m => m.subs.forEach(s => {
    const mine = old.filter(r => r.sid === s.id);
    const list = mine.length ? mine : [newRow(m.id, s.id, m.name, s.name)];
    list.forEach(r => { r.mid = m.id; r.sid = s.id; r.mname = m.name; r.sname = s.name; out.push(r); seen.add(r.id); });
  }));
  old.forEach(r => { if (!seen.has(r.id)) out.push(r); });
  d[k].rows = out;
}
function dayOf(pid, date){
  S.reports[pid] = S.reports[pid] || {};
  const days = S.reports[pid];
  if (!days[date]) days[date] = {hours:'', subs:[], EL:{by:'', rows:[]}, PL:{by:'', rows:[]}, HV:{by:'', rows:[]}};
  const d = days[date];
  d.subs = d.subs || [];
  DISCS.forEach(D => { d[D.k] = d[D.k] || {by:'', rows:[]}; d[D.k].lsup = d[D.k].lsup || []; syncRows(d, D.k); });
  return d;
}
function curDay(){ return dayOf(ui.pid, ui.date); }

// Weighted % of each main activity per TH/block scope: sum of (weightage x % sub done).
function mainPcts(rows, k){
  const m = new Map();
  rows.forEach(r => {
    if (!r.th || !isNum(r.pct)) return;
    const key = r.mid + '|' + scopeKey(r);
    m.set(key, (m.get(key) || 0) + (subW(k, r.sid) / 100) * (r.pct / 100));
  });
  return m;
}
// Groups of rows by main activity, each row with its view values.
function discGroups(d, k){
  const mp = mainPcts(d[k].rows, k);
  const groups = [], byId = new Map();
  d[k].rows.forEach(r => {
    let g = byId.get(r.mid);
    if (!g) {
      const m = findMain(k, r.mid);
      g = {mid: r.mid, name: m ? m.name : (r.mname || '(removed)'), orphan: !m, rows: []};
      byId.set(r.mid, g); groups.push(g);
    }
    g.rows.push(r);
  });
  return groups.map(g => {
    const last = {};
    g.rows.forEach((r, i) => { if (r.th) last[scopeKey(r)] = i; });
    return {...g, rows: g.rows.map((r, i) => {
      const f = findSub(k, r.sid);
      const sc = scopeKey(r);
      const showMain = r.th && last[sc] === i;
      return {r, subName: f ? f.s.name : (r.sname || '(removed)'), w: f ? +f.s.w : 0, scope: sc, showMain: !!showMain,
        mainPct: showMain && mp.has(g.mid + '|' + sc) ? mp.get(g.mid + '|' + sc) : null,
        orphan: !f};
    })};
  });
}
function labSum(d, k){
  const t = Object.fromEntries(LAB.map(x => [x, 0]));
  d[k].rows.forEach(r => LAB_MGC.forEach(x => { t[x] += +(r.lab || {})[x] || 0; }));
  Object.values(supTotals(d, k)).forEach(v => LAB_SUP.forEach(x => { t[x] += v[x]; }));
  return t;
}
// Totals per labour supplier added to a discipline: the sum of that supplier's counts on each activity line.
function supTotals(d, k){
  const ids = (d[k].lsup || []).map(x => x.id), out = {};
  ids.forEach(id => { out[id] = {st: 0, sh: 0}; });
  d[k].rows.forEach(r => ids.forEach(id => { const v = (r.sup || {})[id] || {}; LAB_SUP.forEach(x => { out[id][x] += +v[x] || 0; }); }));
  return out;
}
function filledCount(d, k){ return d[k].rows.filter(r => r.th && isNum(r.pct)).length; }

      <div class="mix">${PT(PALP).map(([k, c]) => `<label class="tin" style="--c:${c}"><span>${k}</span><input type="number" min="0" data-f="bm" data-ti="${i}" data-bi="${bi}" data-k="${k}" value="${(b.v || {})[k] || ''}"></label>`).join('')}</div>
    </div>`).join('')}
    <div style="margin-top:4px">${bnote}</div></div>`;
}
// Villa type that a TH's block gets by default: the TH's most common type.
function dominantType(t){ const e = Object.entries(t.v || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1])[0]; return e ? e[0] : '3BR'; }
// A block holds a count of each villa type, e.g. {'4BR-LUX': 1, '5BR-LUX': 2}.
// When a TH has blocks, its villa types and total are the sum of its blocks.
function bVill(b){ return Object.values(b.v || {}).reduce((a, n) => a + (+n || 0), 0); }
function mixText(m){ return Object.entries(m || {}).map(([k, n]) => `${n} × ${k}`).join(' + ') || 'no villas'; }
function syncTh(t){
  const blocks = t.blocks || [];
  if (!blocks.length) return;
  const dflt = dominantType(t), v = {};
  blocks.forEach(b => {
    if (!b.v) { // older block: one type and a villa count
      b.v = (b.t && TC[b.t]) ? {[b.t]: +b.villas || 0} : {[dflt]: +b.villas || 0};
      delete b.t; delete b.villas;
    }
    const clean = {};
    Object.entries(b.v).forEach(([k, n]) => { if (typeof k === 'string' && k && +n > 0) clean[k] = Math.round(+n); });
    b.v = clean;
    Object.entries(clean).forEach(([k, n]) => { v[k] = (v[k] || 0) + n; });
  });
  t.v = v;
}

/* Map upload: resized, white background filled, saved as JPEG */
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}
// PDF reader (pdf.js) is loaded only when a PDF is chosen.
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsReady = null;
function loadPdfjs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS_BASE + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('Could not load the PDF reader. Check the internet connection and try again.')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
// Each page (up to 10) becomes a JPEG map at up to 1600 px, with a pure white background.
async function pdfToMaps(file){
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const pages = Math.min(doc.numPages, 10), out = [];
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: Math.min(2, 1600 / Math.max(base.width, base.height))});
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: x, viewport: vp}).promise;
    const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
    for (let k = 0; k < d.length; k += 4) { if (d[k] > 232 && d[k + 1] > 232 && d[k + 2] > 232) { d[k] = d[k + 1] = d[k + 2] = 255; } }
    x.putImageData(im, 0, 0);
    out.push({name: pages > 1 ? `${file.name} (page ${i})` : file.name, data: c.toDataURL('image/jpeg', 0.86)});
  }
  return out;
}
async function addMaps(p, files){
  let n = 0;
  for (const f of files) {
    try {
      p.maps = p.maps || [];
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
        const list = await pdfToMaps(f); list.forEach(m => p.maps.push(m)); n += list.length;
      } else {
        p.maps.push({name: f.name, data: await compressImage(f)}); n++;
      }
    }
    catch (e) { toast(e.message, true); }
  }
  if (n) { save(); renderProjects(); toast(n + ' map' + (n > 1 ? 's' : '') + ' added'); }
}
// Rename a TH (or block) in every saved report so existing rows keep their link.
function renameTh(pid, oldN, newN){
  Object.values(S.reports[pid] || {}).forEach(d => {
    ['EL','PL','HV'].forEach(k => (d[k].rows || []).forEach(r => { if (r.th === oldN) r.th = newN; }));
    (d.subs || []).forEach(s => { if (s.th === oldN) s.th = newN; });
  });
  const pr = (S.prog || {})[pid] || {};
  ['EL','PL','HV'].forEach(k => { const dk = pr[k]; if (dk && dk[oldN] && oldN !== newN) { dk[newN] = dk[oldN]; delete dk[oldN]; } });
}
function renameBlock(pid, th, oldB, newB){
  Object.values(S.reports[pid] || {}).forEach(d => {
    ['EL','PL','HV'].forEach(k => (d[k].rows || []).forEach(r => { if (r.th === th && r.block === oldB) r.block = newB; }));
    (d.subs || []).forEach(s => { if (s.th === th && s.block === oldB) s.block = newB; });
  });
  ['EL','PL','HV'].forEach(k => { const tt = (((S.prog || {})[pid] || {})[k] || {})[th]; if (tt && tt[oldB] !== undefined && oldB !== newB) { tt[newB] = tt[oldB]; delete tt[oldB]; } });
}

let PM_CACHE = {};
// MEP IPT Progress: a separate earned-value page, embedded as it was supplied (base64). It keeps its own data in this browser.
const IPT_APP_B64 = '';
let IPT_BASE = null;
// Each project of this app gets its own copy of the tool's data, titled with the project name.
// The tool's Projects card is hidden: the project list is this app's own.
function iptHtml(p, first){
  if (IPT_BASE === null) {
    const bin = atob(IPT_APP_B64);
    IPT_BASE = new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }
  // The tool's data is scoped per app project. The first project keeps the original storage keys,
  // so data entered before this version is still there.
  const js = v => JSON.stringify(v).replace(/</g, '\\u003c');
  const boot = `<script>const IPT_ID=${js(p.id)};const IPT_NAME=${js(p.name)};const IPT_LEGACY=${first ? 'true' : 'false'};<\/script>\n<script>`;
  let out = IPT_BASE
    .replace('<script>\nconst APP_VERSION', () => boot + '\nconst APP_VERSION')
    .replace("const STORE_KEY=KEY_BASE;", () => "const STORE_KEY=IPT_LEGACY?KEY_BASE:KEY_BASE+':'+IPT_ID;")
    .replace("const MULTI_KEY='mep-ipt-projects-v3';", () => "const MULTI_KEY=IPT_LEGACY?'mep-ipt-projects-v3':'mep-ipt-projects-v3:'+IPT_ID;")
    .replace('</style>', () => '#projectsCard{display:none !important}</style>');
  // Wherever the tool shows its project name, show the app's project name instead.
  out = out.split('S.project||').join('IPT_NAME||S.project||');
  return out;

// Backup and restore of the site progress map. The map keeps its data in its own frame, so the app
// uses the map's own Backup and Restore buttons inside that frame.
const PM_LOCK = {tv1: 'taormina', tv2: 'taormina-02', rh1: 'reportage-hills'};
function pmDoc(){
  const f = document.getElementById('pmFrame');
  try { return f && f.contentDocument && f.contentDocument.getElementById('backupBtn') ? f.contentDocument : null; } catch (e) { return null; }

function pmBackup(){

// The map's PDF buttons need jsPDF. If the frame could not load its own copy, use the copy the app already loaded.
function pmBridge(){

// First open of a map in this browser: feed the saved progress into the map's own Restore input,
// so the map validates and stores it exactly as a manual restore would. Runs once per map and version.
function pmImport(pid){
  const lock = PM_LOCK[pid];
  if (!lock || !PM_IMPORT[pid]) return;
  const key = 'mdr-pm-import:' + lock;
  try { if (localStorage.getItem(key) === PM_IMPORT_VER) return; } catch (e) { return; }
  const doc = pmDoc();
  const inp = doc && doc.getElementById('restoreFile');
  if (!inp) return;
  const bin = atob(PM_IMPORT[pid]);
  const text = new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  const dt = new DataTransfer();
  dt.items.add(new File([text], 'progress-' + lock + '.json', {type: 'application/json'}));
  inp.files = dt.files;
  const started = Date.now();
  inp.dispatchEvent(new Event('change'));
  // Mark as done only if the map actually wrote the project; otherwise try again on the next open.
  setTimeout(() => {
    try {
      const p = JSON.parse(localStorage.getItem('tmp-' + lock) || 'null');
      if (p && p.updated >= started) { localStorage.setItem(key, PM_IMPORT_VER); renderProject(); }
    } catch (e) {}
  }, 1500);
}
function pmRestore(input){
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const doc = pmDoc();
  if (!doc) { toast('The site progress map is still loading. Try again in a moment.', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('That file is not a map backup. Nothing was changed.', true); return; }
    const lock = PM_LOCK[curProj().id];
    const ok = data && Array.isArray(data.projects) && data.projects.some(x => x && x.id === lock && typeof x.name === 'string' && Array.isArray(x.acts));
    if (!ok) { toast('That file is not a backup of this project. Nothing was changed.', true); return; }
    const frameInput = doc.getElementById('restoreFile');
    const dt = new DataTransfer();
    dt.items.add(file);
    frameInput.files = dt.files;
    frameInput.dispatchEvent(new Event('change'));
    toast('Restoring from backup...');
    setTimeout(() => { renderProject(); toast('Backup restored. The map shows the restored data.'); }, 900);
  };
  reader.readAsText(file);
}

function refreshSubTotals(){
  const d = curDay(), subs = d.subs || [];
  document.querySelectorAll('#v-project [data-msum]').forEach(el => {
    const [dk, sid] = el.dataset.msum.split('|');
    el.textContent = subs.filter(x => x.disc === dk && x.sid === sid).reduce((a, x) => a + (+x.man || 0), 0);
  });
  document.querySelectorAll('#v-project [data-qsum]').forEach(el => {
    const [dk, sid] = el.dataset.qsum.split('|');
    el.textContent = subs.filter(x => x.disc === dk && x.sid === sid).reduce((a, x) => a + (+x.qty || 0), 0);
  });
  const g = subs.reduce((a, x) => a + (+x.man || 0), 0), gq = subs.reduce((a, x) => a + (+x.qty || 0), 0);
  const gm = document.querySelector('#v-project [data-gm]'); if (gm) gm.textContent = g;

/* ============ Exports (MGC report layout, same sheets as the Excel) ============ */
function reportMeta(p, d, D){
  return {title: 'MODUN GULF BUILDING CONTRACTING (MGC)', sub: 'MEP Department — Daily Manpower & Progress Report',
    report: D ? `${D.n.toUpperCase()} REPORT (${D.letter})` : 'SUBCONTRACTORS (ALL DISCIPLINES)',
    line: D ? `${D.n.toUpperCase()} — MGC & LABOUR SUPPLIERS` : 'MEP SUB CONTRACTORS DAILY WORK DETAILS',
    date: fmtIso(ui.date), day: fmtLong(ui.date), hours: d.hours || '', by: (D ? d[D.k].by : '') || '', project: p.name.toUpperCase()};
}
function discLines(d, k){
  return discGroups(d, k).map(g => ({name: g.name, rows: g.rows.map(v => ({
    sub: v.subName, w: v.w, th: v.r.th || '', block: v.r.th ? (v.r.block || 'Full TH') : '',
    pct: isNum(v.r.pct) ? +v.r.pct : null, mainPct: v.mainPct,
    lab: LAB.map(x => +(v.r.lab || {})[x] || 0), sup: v.r.sup || {}, rem: v.r.rem || ''}))}));
}
// A line has values if it has a TH, a % done, labour or supplier counts, or a remark. Empty lines are left out of the PDF.
function lineHasValue(r){
  return !!r.th || r.pct != null || r.lab.some(x => +x) || Object.values(r.sup).some(v => Object.values(v).some(x => +x)) || !!r.rem;
}
function subLines(d){
  return SUB_DISCS.map(SD => {
    const items = (d.subs || []).filter(x => x.disc === SD.k);
    const order = []; items.forEach(x => { if (!order.includes(x.sid)) order.push(x.sid); });
    return {SD, subs: order.map(sid => {
      const rs = items.filter(x => x.sid === sid);
      return {name: (S.subs.find(s => s.id === sid) || {name: rs[0].sname || '(removed)'}).name, rows: rs,
        qty: rs.reduce((a, x) => a + (+x.qty || 0), 0), man: rs.reduce((a, x) => a + (+x.man || 0), 0)};
    }), items};
  }).filter(x => x.items.length);
}
const fmtN = v => v ? v : '';
function pdfHead(doc, meta, W){
  doc.setTextColor(15, 42, 68); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text(meta.title, 10, 12);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(71, 85, 105);
  doc.text(meta.sub, 10, 17);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 23, 42);
  doc.text(meta.report, W - 10, 12, {align: 'right'});
  doc.setFontSize(10); doc.text(meta.line, 10, 24);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text('DATE: ' + meta.date + ' (' + meta.day + ')', W - 10, 24, {align: 'right'});
  doc.text('PROJECT: ' + meta.project, 10, 29);
  doc.text('WORKING HOURS: ' + (meta.hours || '—'), W / 2, 29, {align: 'center'});
  doc.text('PREPARED BY: ' + (meta.by || '—'), W - 10, 29, {align: 'right'});
}
function exportPdf(){
  const p = curProj(), d = curDay();

  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
  const W = doc.internal.pageSize.getWidth();
  DISCS.forEach((D, i) => {
    if (i) doc.addPage('a4', 'landscape');
    pdfHead(doc, reportMeta(p, d, D), W);
    const groups = discLines(d, D.k).map(g => ({name: g.name, rows: g.rows.filter(lineHasValue)})).filter(g => g.rows.length), body = [], sups = d[D.k].lsup || [];
    groups.forEach(g => g.rows.forEach((r, i2) => {
      const row = [];
      if (i2 === 0) row.push({content: g.name, rowSpan: g.rows.length, styles: {valign: 'middle', fontStyle: 'bold', fillColor: D.rt}});

    doc.autoTable({

        {content: 'TH NO.', rowSpan: 2}, {content: 'BLOCK', rowSpan: 2}, {content: '% SUB ACTIVITY DONE', rowSpan: 2},

      body: body.length ? body : [[{content: 'No lines', colSpan: 11 + 2 * sups.length}]],
      foot: [[{content: 'TOTAL', colSpan: 7, styles: {halign: 'right'}}, ...LAB_MGC.map(x => tot[x] || ''),
        ...sups.flatMap(s => LAB_SUP.map(y => (stot[s.id] || {})[y] || '')), '']],
      styles: {fontSize: 7.2, cellPadding: 0.9, valign: 'middle', halign: 'center', lineColor: [203, 213, 225], lineWidth: 0.1},

  doc.save(`DMR ${p.name} ${ui.date}.pdf`);

      });

  });

  sws.mergeCells(`B${sr}:F${sr}`); sws.getCell(`B${sr}`).value = 'TOTAL';

  sws.getCell(`G${sr}`).value = gq2 || null; style(sws.getCell(`G${sr}`), {bold:true, fill:'FFE2E8F0'});
  sws.getCell(`H${sr}`).value = gm2 || null; style(sws.getCell(`H${sr}`), {bold:true, fill:'FFE2E8F0'});
  style(sws.getCell(`I${sr}`), {fill:'FFE2E8F0'});
  const buf = await wb.xlsx.writeBuffer();

}

// Project daily report
/* ============ Import a foreman's Markdown manpower report (v1.47) ============ */
function mdClean(s){ return String(s == null ? '' : s).replace(/[`*]/g, '').replace(/\s+/g, ' ').trim(); }
function mdBlank(s){ const c = mdClean(s); return !c || c === '-' || /^\(blank\)$/i.test(c) || /^\(faint/i.test(c); }
function mdCells(line){ let s = line.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|')) s = s.slice(0, -1); return s.split('|').map(c => c.trim()); }
function mdActName(s){ return mdClean(s).replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim().toUpperCase(); }
function mdNum(s){ if (mdBlank(s)) return null; const m = mdClean(s).match(/^(\d+(?:\.\d+)?)/); return m ? +m[1] : null; }
function mdDate(s){ const m = mdClean(s).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (!m) return null; let y = +m[3]; if (y < 100) y += 2000; return y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0'); }
function mdFloor(s){ const m = mdClean(s).match(/\b(GF|1F|2F)\b/i); return m ? m[1].toUpperCase() : ''; }

// Reads a foreman's TH text such as "TH6-B1", "17 B4", "01" or "TH05B2". Ranges and unknown TH numbers are kept as a note only.
function mdLocate(p, text){
  const raw = mdClean(text);
  if (mdBlank(raw)) return {th: '', block: '', note: ''};
  const note = 'Foreman TH: ' + raw;
  const c = raw.replace(/\(.*?\)/g, '').trim();
  if (!c) return {th: '', block: '', note};
  if (/^(?:TH\s*-?\s*)?\d+\s*-\s*\d+\b/i.test(c)) return {th: '', block: '', note};
  const m = c.match(/^(?:TH\s*-?\s*)?0*(\d{1,2})(?!\d)/i);
  if (!m) return {th: '', block: '', note};
  const t = (p.ths || []).find(x => { const n = String(x.th).match(/(\d+)$/); return n && +n[1] === +m[1]; });
  if (!t) return {th: '', block: '', note};
  const bm = c.match(/B\s*(\d)/i);
  const want = bm ? 'B' + bm[1] : '';
  if (!want) return {th: t.th, block: '', note: ''};
  if ((t.blocks || []).some(b => String(b.name).toUpperCase() === want)) return {th: t.th, block: want, note: ''};
  return {th: t.th, block: '', note};
}

// Finds the activity in the database. Slab works exist per floor, so the floor and main activity pick one.
function mdFindSub(k, mainName, actName, floor){
  const want = mdActName(actName);
  const cands = [];
  (S.act[k] || []).forEach(m => m.subs.forEach(s => { if (mdActName(s.name) === want) cands.push({m, s}); }));
  if (cands.length <= 1) return cands[0] || null;
  const mw = mdActName(mainName);
  let c = cands.filter(x => x.m.name.toUpperCase() === mw);
  if (c.length === 1) return c[0];
  c = cands.filter(x => mw && x.m.name.toUpperCase().includes(mw));
  if (floor) { const f = c.filter(x => x.m.name.toUpperCase().startsWith(floor)); if (f.length) return f[0]; }
  if (c.length === 1) return c[0];
  return Object.assign({ambiguous: true}, c[0] || cands[0]);
}

// Chooses the report line for an activity: the same TH and block, else an empty line, else a new line for that activity.
function pickRow(d, k, cand, loc){
  const rows = d[k].rows.filter(r => r.sid === cand.s.id);
  if (loc.th) { const same = rows.find(r => r.th === loc.th && (r.block || '') === (loc.block || '')); if (same) return same; }
  const empty = rows.find(r => !r.th && !r.block && r.pct == null && !r.rem && LAB.every(x => !((r.lab || {})[x])));
  if (empty) return empty;
  const nr = newRow(cand.m.id, cand.s.id, cand.m.name, cand.s.name);
  d[k].rows.splice(d[k].rows.indexOf(rows[rows.length - 1]) + 1, 0, nr);
  return nr;
}

// Reads the Markdown into tables, the project name, the date and the per-discipline details. Nothing is saved here.
function parseManpowerMd(text){
  const out = {project: '', date: null, tables: [], meta: {}};
  let sec = null, header = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { header = null; continue; }
    const h = line.match(/^##\s+(?:\d+\.\s*)?(.+)$/);
    if (h) {
      const t = h[1].toUpperCase();
      sec = t.includes('PLUMBING') ? 'PL' : t.includes('HVAC') ? 'HV' : t.includes('ELECTRICAL') ? 'EL' : t.includes('SUB CONTRACTOR') ? 'SUB' : null;
      header = null; continue;
    }
    if (line.startsWith('|')) {
      const cells = mdCells(line);
      if (cells.every(c => /^:?-+:?$/.test(c))) continue;
      if (!header) { header = cells.map(c => mdClean(c).toLowerCase()); continue; }
      if (sec) out.tables.push({sec, header, cells});
      continue;
    }
    const kv = line.match(/^\*?\s*\*\*([^*]+?):\*\*\s*(.*)$/);
    if (kv) {
      const key = kv[1].trim().toLowerCase(), val = kv[2].trim();
      if (!sec && key === 'project' && !out.project) out.project = mdClean(val).toUpperCase();
      else if (!sec && key === 'date' && !out.date) out.date = mdDate(val);
      else if (sec) { out.meta[sec] = out.meta[sec] || {}; out.meta[sec][key] = val; }
    }
  }
  return out;
}

// Writes the parsed report into the project and date it names (falls back to the open project and date).
function applyManpowerImport(parsed){
  const named = parsed.project, warnings = [];
  let p = (S.projects || []).find(x => named && x.name.toUpperCase() === named);
  if (!p) p = curProj();
  if (named && p.name.toUpperCase() !== named) warnings.push('Project "' + named + '" is not in this app, so the report went into ' + p.name + '.');
  const date = parsed.date || ui.date;
  const d = dayOf(p.id, date);
  const res = {p, date, warnings, lines: 0, subs: 0, notes: []};
  const supSum = {EL: {st: 0, sh: 0}, PL: {st: 0, sh: 0}, HV: {st: 0, sh: 0}};

  parsed.tables.forEach(tb => {
    const {sec, header, cells} = tb;
    const at = pred => header.findIndex(pred);
    if (sec === 'SUB') {
      const cDisc = at(h => h.startsWith('discipline')), cSub = at(h => h.startsWith('sub contractor'));
      const cAct = at(h => h === 'activity'), cTh = at(h => h.startsWith('th no')), cQty = at(h => h.startsWith('completed'));
      const cMan = at(h => h === 'manpower'), cRem = at(h => h === 'remarks');
      const discRaw = mdClean(cells[cDisc]).toUpperCase();
      const dk = discRaw.includes('HVAC') ? 'HV' : discRaw.includes('ELECTRICAL') ? 'EL' : discRaw.includes('PLUMBING') ? 'PL' : discRaw === 'LPG' ? 'LPG' : '';
      const subName = mdClean(cells[cSub]).toUpperCase();
      if (!dk || !subName) return;
      const act = mdBlank(cells[cAct]) ? '' : mdClean(cells[cAct]);
      const loc = mdLocate(p, cells[cTh]);
      const qtyText = mdBlank(cells[cQty]) ? '' : mdClean(cells[cQty]);
      const qty = /^\d+$/.test(qtyText) ? +qtyText : null;
      const man = mdNum(cells[cMan]);
      const remark = mdBlank(cells[cRem]) ? '' : mdClean(cells[cRem]);
      if (!act && !loc.th && qty == null && man == null && !remark) return;
      const sub = S.subs.find(x => x.name.toUpperCase() === subName);
      if (!sub) { warnings.push('Sub contractor "' + subName + '" is not in the Sub contractor database.'); return; }
      const rem = [remark, qtyText && qty == null ? 'Completed: ' + qtyText : '', loc.note].filter(Boolean).join('; ');
      let e = d.subs.find(x => x.disc === dk && x.sid === sub.id && x.th === loc.th && x.act === act);
      if (!e) { e = {id: 'x' + uid(), disc: dk, sid: sub.id, sname: sub.name, act, th: loc.th, block: '', qty: null, man: null, rem: ''}; d.subs.push(e); }
      e.block = loc.block; e.qty = qty; e.man = man; e.rem = rem;
      res.subs++;
      return;
    }
    if (!['PL', 'HV', 'EL'].includes(sec)) return;
    const cMain = at(h => h === 'main activity'), cAct = at(h => h === 'activity');
    const cTh = at(h => h.startsWith('th no')), cPct = at(h => h.startsWith('% done')), cRem = at(h => h === 'remarks');
    const labCols = {};
    header.forEach((h, i) => {
      if (h.startsWith('mgc')) labCols[i] = h.includes('charge') ? 'mch' : h.includes('asst') ? 'ma' : 'mt';
      else if (h.startsWith('labour supplier')) labCols[i] = h.includes('helper') ? 'sh' : 'st';
    });
    if (cAct < 0 || mdBlank(cells[cAct])) return;
    const actRaw = mdClean(cells[cAct]), thRaw = cTh >= 0 ? cells[cTh] : '';
    const loc = mdLocate(p, thRaw);
    const cand = mdFindSub(sec, cMain >= 0 ? mdClean(cells[cMain]) : '', actRaw, mdFloor(thRaw));
    if (!cand) { warnings.push(sec + ': "' + mdActName(actRaw) + '" is not in the activity database.'); return; }
    if (cand.ambiguous) warnings.push(sec + ': "' + mdActName(actRaw) + '" fits more than one floor; used ' + cand.m.name + '.');
    const pct = cPct >= 0 ? mdNum(cells[cPct]) : null;
    const remark = cRem >= 0 && !mdBlank(cells[cRem]) ? mdClean(cells[cRem]) : '';
    const lab = {};
    Object.entries(labCols).forEach(([i, key]) => {
      const v = mdNum(cells[i]);
      if (v == null) return;
      if (key === 'st' || key === 'sh') supSum[sec][key] += v; else lab[key] = v;
    });
    if (!loc.th && pct == null && !Object.keys(lab).length && !remark && !loc.note) return;
    const r = pickRow(d, sec, cand, loc);
    if (loc.th) { r.th = loc.th; r.block = loc.block; }
    if (pct != null) r.pct = Math.max(0, Math.min(100, pct));
    r.lab = r.lab || {};
    LAB_MGC.forEach(x => { if (lab[x] != null) r.lab[x] = lab[x]; });
    const parts = [remark, loc.note].filter(Boolean);
    if (parts.length) r.rem = parts.join('; ');
    if (r.th && r.pct != null) progStore(S.prog, p.id, sec, r.th, r.block || '', r.sid, r.pct);
    res.lines++;
  });

  ['EL', 'PL', 'HV'].forEach(k => {
    const m = parsed.meta[k] || {};
    const by = m['prepared by'] ? mdClean(m['prepared by']) : '';
    if (by && !mdBlank(by)) d[k].by = by;
    const hours = m['working hours'] ? mdClean(m['working hours']) : '';
    if (hours && !mdBlank(hours)) d.hours = hours;
    ['top margin note', 'bottom margin note'].forEach(key => { if (m[key] && !mdBlank(m[key])) res.notes.push(k + ': ' + mdClean(m[key])); });
    if (supSum[k].st || supSum[k].sh) {
      d[k].lsup = d[k].lsup || [];
      let e = d[k].lsup.find(x => x.name === 'Imported labour supplier');
      if (!e) { e = {id: 'ls' + uid(), sid: null, name: 'Imported labour supplier', lab: {}, rem: ''}; d[k].lsup.push(e); }
      e.lab = {st: supSum[k].st, sh: supSum[k].sh};
    }
  });
  return res;
}

async function importMd(input){
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const parsed = parseManpowerMd(await f.text());
  if (!parsed.tables.length) { toast('No report tables were found in that file.', true); return; }
  const res = applyManpowerImport(parsed);
  ui.pid = res.p.id; ui.date = res.date;
  save(); renderProject();
  let msg = 'Imported ' + res.lines + ' activity lines and ' + res.subs + ' sub contractor lines into ' + res.p.name + ' for ' + res.date + '.';
  if (res.notes.length) msg += ' Margin notes (not stored): ' + res.notes.join(' | ');
  if (res.warnings.length) msg += ' To check: ' + res.warnings.slice(0, 4).join(' ');
  toast(msg, res.warnings.length > 0);
}

$('#v-project').addEventListener('change', e => {
  const t = e.target, p = curProj(), d = curDay();

    const v = t.value === '' ? null : Math.max(0, Math.min(100, +t.value || 0));

    progStore(S.prog, p.id, t.dataset.pdisc, t.dataset.pth, t.dataset.pblk, t.dataset.psid, v);

    const left = t.closest('td').querySelector('.pg-left');

    return;
  }
  if (t.id === 'rHours') { d.hours = t.value.trim(); save(); return; }
  if (t.dataset.by) { d[t.dataset.by].by = t.value.trim(); save(); return; }
  if (t.id === 'sbDisc') { ui.subAddDisc = t.value; renderProject(); return; }

  if (t.dataset.lsf) {
    const sp = (d[ui.disc].lsup || []).find(x => x.id === t.dataset.lsid); if (!sp) return;
    if (t.dataset.lsf === 'rem') sp.rem = t.value.trim();
    else { sp.lab = sp.lab || {}; const v = t.value === '' ? null : Math.max(0, +t.value || 0); sp.lab[t.dataset.lsf] = v; t.value = v == null ? '' : v; }
    save(); refreshTotals(ui.disc); return;
  }
  const tr = t.closest('tr[data-rid]');
  if (tr && t.dataset.f) {
    const k = ui.disc, r = d[k].rows.find(x => x.id === tr.dataset.rid); if (!r) return;
    const f = t.dataset.f;
    // Redrawing the page keeps the scroll position, so the window does not jump when a TH or block is picked.
    if (f === 'th') { r.th = t.value; r.block = ''; save(); renderKeepScroll(); return; }
    if (f === 'block') { r.block = t.value; save(); return; }
    if (f === 'pct') { r.pct = t.value === '' ? null : Math.max(0, Math.min(100, +t.value)); t.value = r.pct == null ? '' : r.pct; progStore(S.prog, ui.pid, k, r.th, r.block || '', r.sid, r.pct); save(); refreshMain(k); return; }
    if (f === 'rem') { r.rem = t.value.trim(); save(); return; }
    if (f === 'sup') { r.sup = r.sup || {}; const v = r.sup[t.dataset.sid] = r.sup[t.dataset.sid] || {}; v[t.dataset.x] = t.value === '' ? null : Math.max(0, +t.value || 0); save(); refreshTotals(k); return; }
    if (LAB_MGC.includes(f)) { r.lab = r.lab || {}; r.lab[f] = t.value === '' ? null : Math.max(0, +t.value || 0); save(); refreshTotals(k); return; }
    return;
  }
  const sr = t.closest('tr[data-sr]');
  if (sr && t.dataset.sf) {
    const x = (d.subs || []).find(y => y.id === sr.dataset.sr); if (!x) return;
    const f = t.dataset.sf;
    if (f === 'th') { x.th = t.value; x.block = ''; save(); renderKeepScroll(); return; }
    if (f === 'block') { x.block = t.value; save(); return; }
    if (f === 'act') x.act = t.value.trim();
    if (f === 'qty') x.qty = t.value === '' ? null : Math.max(0, +t.value || 0);
    if (f === 'man') x.man = t.value === '' ? null : Math.max(0, +t.value || 0);
    if (f === 'rem') x.rem = t.value.trim();
    save(); refreshSubTotals();
  }
});
// The base line of each database sub activity is permanent. Lines added with +TH or All TH can be removed.
// Lines for a sub activity that is no longer in the database (orphans) can always be removed.
function isBaseRow(rows, r, k){
  return !!findSub(k, r.sid) && rows.find(x => x.sid === r.sid) === r;
}
function rowAction(b){
  const tr = b.closest('tr[data-rid]'), k = ui.disc, d = curDay();
  if (!tr) return;
  const rows = d[k].rows, r = rows.find(x => x.id === tr.dataset.rid); if (!r) return;
  const a = b.dataset.act;
  if (a === 'addth') {
    const nr = newRow(r.mid, r.sid, r.mname, r.sname);
    rows.splice(rows.indexOf(r) + 1, 0, nr);
  }
  else if (a === 'del') {
    if (isBaseRow(rows, r, k)) { toast('The base line of a sub activity cannot be deleted. Remove only the lines you added.', true); return; }
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Sure?'; setTimeout(() => { if (b.isConnected) { b.removeAttribute('data-armed'); b.textContent = '×'; } }, 3000); return; }
    rows.splice(rows.indexOf(r), 1);
  }
  save(); renderProject();
}
function addSubRow(){
  const p = curProj(), d = curDay();
  const disc = ui.subAddDisc, sid = document.getElementById('sbSub').value;
  const sub = S.subs.find(s => s.id === sid);
  if (!sub) { toast('Pick a subcontractor. Add new ones in the Sub contractor database.', true); return; }
  const th = document.getElementById('sbTh').value, block = document.getElementById('sbBlock').value;
  d.subs.push({id: 'x' + uid(), disc, sid, sname: sub.name, act: document.getElementById('sbAct').value.trim(), th, block: th ? block : '',
    qty: document.getElementById('sbQty').value === '' ? null : +document.getElementById('sbQty').value,
    man: document.getElementById('sbMan').value === '' ? null : +document.getElementById('sbMan').value,
    rem: document.getElementById('sbRem').value.trim()});
  save(); renderProject(); toast('Added ' + sub.name);
}
function subRowDelete(b){
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Sure?'; setTimeout(() => { if (b.isConnected) { b.removeAttribute('data-armed'); b.textContent = '×'; } }, 3000); return; }
  const tr = b.closest('tr[data-sr]'), d = curDay();
  d.subs = d.subs.filter(x => x.id !== tr.dataset.sr);
  save(); renderProject();
}

    const w = +document.querySelector(`[data-neww="${m.id}"]`).value || 0;

/* ============ Backup and restore ============ */
function backupAll(){
  const blob = new Blob([JSON.stringify({app:'mep-daily-report', version: APP_VERSION, saved: new Date().toISOString(), ...S}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `MEP-daily-report-backup-${todayIso()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function restoreAll(file){
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.projects) || !data.act || !data.subs) throw new Error('Not a MEP daily report backup');
    S = {projects: data.projects, act: data.act, subs: data.subs, labsup: data.labsup || [], reports: data.reports || {}, prog: data.prog || {}, access: data.access || S.access};
    if (!data.prog) migrateProgress(S);
    save(); ui.editId = null; renderProjects(); toast('Backup restored');
  } catch (err) { toast(err.message || 'Could not restore this file', true); }
}
